name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BaoMatThongTin.slnx -c Release

      - name: Smoke test (console)
        run: |
          dotnet run -c Release --project CryptoBench -- sign
          dotnet run -c Release --project CryptoBench -- aes 50
          dotnet run -c Release --project CryptoBench -- rsa 20

      - name: Publish app .exe (self-contained, single file)
        run: |
          dotnet publish Bai1_AES/Bai1_AES.csproj -p:PublishProfile=FolderProfile
          dotnet publish Bai2_RSA/Bai2_RSA.csproj -p:PublishProfile=FolderProfile
          Get-Item README.md, HUONG_DAN.md -ErrorAction SilentlyContinue | Copy-Item -Destination publish/
          Compress-Archive -Path publish/* -DestinationPath BaoMatThongTin-win-x64.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: BaoMatThongTin-win-x64
          path: publish/

      - name: GitHub Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BaoMatThongTin-win-x64.zip
