name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build BaoMatThongTin.slnx -c Release
      - name: Smoke test (console)
        run: |
          dotnet run -c Release --project CryptoBench -- sign
          dotnet run -c Release --project CryptoBench -- aes 50
          dotnet run -c Release --project CryptoBench -- rsa 20
